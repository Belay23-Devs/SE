<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!-- Font Awesome Icons -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

   <!-- Google Fonts -->
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

   <!-- CSS File -->
   <link rel="stylesheet" href="style.css">

   <title>Smart Login Page</title>
</head>

<body>

   <!-- Main Login Container -->
   <div class="allForms">

      <!-- Login Header -->
      <div class="forms" id="div1">

         <h2 id="login">Login to Your Account</h2>

         <p id="info">Enter your information to continue</p>

      </div>


      <!-- Login Form -->
      <div class="forms" id="forms">

         <form class="type" id="loginForm">

            <!-- Name Input -->
            <label for="name">Full Name</label>

            <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name">

            <br><br>


            <!-- Email Input -->
            <label for="email">Email Address</label>

            <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">

            <br><br>


            <!-- Password Input -->
            <label for="password">Password</label>

            <div class="password-box">

               <input type="password" id="password" name="password" placeholder="Enter your password"
                  autocomplete="current-password">

               <!-- Show / Hide Password -->
               <button type="button" id="togglePassword" aria-label="Show password">

                  <i class="fa-solid fa-eye"></i>

               </button>

            </div>

            <br><br>


            <!-- Remember Me and Forgot Password -->
            <div class="remember-section">

               <div>

                  <input type="checkbox" id="remember" name="remember">

                  <label for="remember" class="remember-label">
                     Remember Me
                  </label>

               </div>

               <a href="#" id="forgotPassword">
                  Forgot Password?
               </a>

            </div>

            <br><br>


            <!-- Login Button -->
            <button type="submit">

               <i class="fa-solid fa-right-to-bracket"></i>

               Login

            </button>

         </form>

      </div>

   </div>


   <!-- JavaScript File -->
   <script src="script.js"></script>

</body>

</html>
